[package]
name = "dwmapi_proxy"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Loader-hijack proxy for dwmapi.dll - forwards to system DWMAPI and loads RustyTools.dll into steam.exe"
license = "MIT"

[lib]
name = "dwmapi"
crate-type = ["cdylib"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
] }
