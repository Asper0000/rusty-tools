[workspace]
members = ["proxies/dwmapi_proxy", "proxies/xinput1_4_proxy", "tools/extract_tickets"]
default-members = [".", "proxies/dwmapi_proxy", "proxies/xinput1_4_proxy", "tools/extract_tickets"]

[package]
name = "rusty_tools"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Rust port of OpenSteamTool / BetterSteamTools"
license = "GPLv3"

[lib]
name = "RustyTools"
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "ost-cli"
path = "src/main.rs"

[dependencies]

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

tracing = "0.1"

anyhow = "1"
thiserror = "1"

once_cell = "1"
parking_lot = "0.12"
bitflags = "2"
paste = "1"
chrono = { version = "0.4", features = ["serde"] }

sha2 = "0.10"
hex = "0.4"

mlua = { version = "0.9", features = ["lua54", "vendored", "send"] }

prost = "0.13"
prost-types = "0.13"

[build-dependencies]
prost-build = "0.13"
protoc-bin-vendored = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Environment",
    "Win32_System_IO",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
